[package]
name = "balance"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
dotenv_codegen = "0.15.0"
env = "1.0.1"
redis = "0.32.7"
once_cell = "1.21.3"
serde = "1.0.228"
sqlx = { version = "0.8.6", features = [ "mysql", "runtime-tokio", "tls-native-tls" ] }
tokio = { version = "1.48.0", features = [ "full" ] }
tonic = "0.14.2"
axum = { version = "0.8.6", features = [ "http2" ] }
serde_json = "1.0.145"
async-trait = "0.1.89"
clap = { version = "4.5.54", features = [ "derive" ] }

[features]
local = []
